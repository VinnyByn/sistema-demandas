name: Testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04 # Playwright 1.56 não instala navegador no Ubuntu 26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verificar sintaxe dos scripts
        run: |
          for f in site/js/*/*.js supabase/functions/_shared/*.mjs supabase/functions/_shared/asana/*.mjs scripts/*.mjs scripts/migracao-firebase/*.mjs; do node --check "$f"; done

      - name: Instalar dependências
        run: npm ci

      - name: Testes unitários
        run: npm run test:unit

      - name: Edge Functions (tipos e testes no Deno)
        run: npm run test:deno

      - name: Instalar navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Testes ponta a ponta (Playwright)
        env:
          CI: "true"
        run: npm run test:e2e

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report
          retention-days: 7
